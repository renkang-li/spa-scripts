<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPA Scripts Desktop</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Windows Prototype</p>
          <h1>SPA Scripts Desktop</h1>
        </div>
        <div class="status-pill" id="run-status">Idle</div>
      </header>

      <main class="layout">
        <aside class="panel project-panel">
          <div class="panel-head">
            <div>
              <p class="eyebrow">Projects</p>
              <h2>仓库选择</h2>
            </div>
            <button class="ghost-button" id="refresh-projects" type="button">刷新</button>
          </div>

          <label class="field">
            <span>搜索项目</span>
            <input id="project-search" type="text" placeholder="输入名称过滤">
          </label>

          <div class="row-actions">
            <button class="ghost-button" id="select-all-projects" type="button">全选可见</button>
            <button class="ghost-button" id="clear-projects" type="button">清空</button>
          </div>

          <p class="summary" id="project-summary">未加载项目</p>
          <div id="project-list" class="project-list"></div>
        </aside>

        <section class="workspace">
          <section class="status-grid">
            <article class="panel status-card">
              <div class="panel-head">
                <div>
                  <p class="eyebrow">Workspace</p>
                  <h2>扫描目录</h2>
                </div>
                <button class="ghost-button" id="choose-workspace" type="button">选择目录</button>
              </div>
              <p class="status-value" id="workspace-path"></p>
            </article>

            <article class="panel status-card">
              <p class="eyebrow">Dependencies</p>
              <h2>依赖状态</h2>
              <div class="dependency-list" id="dependency-status"></div>
            </article>
          </section>

          <section class="panel tool-panel">
            <div class="tabs">
              <button class="tab-button active" type="button" data-tab="branch">创建分支</button>
              <button class="tab-button" type="button" data-tab="merge">创建 MR</button>
              <button class="tab-button" type="button" data-tab="version">创建版本</button>
            </div>

            <div class="tab-panels">
              <section class="tab-panel active" data-panel="branch">
                <div class="form-grid">
                  <label class="field">
                    <span>分支名</span>
                    <input id="branch-name" type="text" placeholder="feature/XXXX">
                  </label>
                </div>

                <div class="checkbox-row">
                  <label><input id="branch-stash" type="checkbox"> 自动 stash 未提交改动</label>
                  <label><input id="branch-force" type="checkbox"> 分支已存在时强制重建</label>
                </div>

                <div class="action-bar">
                  <p>对已选项目执行 `create-branch.js`。</p>
                  <button class="primary-button" id="run-branch" type="button">执行创建分支</button>
                </div>
              </section>

              <section class="tab-panel" data-panel="merge">
                <div class="form-grid two-columns">
                  <label class="field">
                    <span>源分支</span>
                    <input id="merge-source" type="text" placeholder="feature/XXXX">
                  </label>

                  <label class="field">
                    <span>目标分支</span>
                    <input id="merge-target" type="text" value="master">
                  </label>
                </div>

                <div class="form-grid">
                  <label class="field">
                    <span>MR 标题</span>
                    <input id="merge-title" type="text" placeholder="feat: add new flow">
                  </label>

                  <label class="field">
                    <span>MR 描述</span>
                    <textarea id="merge-description" rows="4" placeholder="可选，支持 飞书 号或简述"></textarea>
                  </label>

                  <label class="field">
                    <span>提交信息</span>
                    <input id="merge-commit-message" type="text" placeholder="默认跟随 MR 标题">
                  </label>
                </div>

                <div class="checkbox-row">
                  <label><input id="merge-draft" type="checkbox" checked> Draft MR</label>
                  <label><input id="merge-commit" type="checkbox"> 创建前自动 commit</label>
                  <label><input id="merge-push" type="checkbox"> 创建前自动 push</label>
                </div>

                <div class="action-bar">
                  <p>对已选项目执行 `create-merge.js`。</p>
                  <button class="primary-button" id="run-merge" type="button">执行创建 MR</button>
                </div>
              </section>

              <section class="tab-panel" data-panel="version">
                <div class="form-grid">
                  <label class="field">
                    <span>Tag 消息</span>
                    <input id="version-message" type="text" placeholder="可选，默认使用版本号">
                  </label>
                </div>

                <div class="checkbox-row">
                  <label><input id="version-push" type="checkbox"> 自动 push tag</label>
                  <label><input id="version-dry-run" type="checkbox"> 仅预览，不实际创建</label>
                </div>

                <div class="action-bar">
                  <p>对已选项目执行 `create-version.js`。</p>
                  <button class="primary-button" id="run-version" type="button">执行创建版本</button>
                </div>
              </section>
            </div>
          </section>

          <section class="panel log-panel">
            <div class="panel-head">
              <div>
                <p class="eyebrow">Output</p>
                <h2>执行日志</h2>
              </div>
              <button class="ghost-button" id="clear-log" type="button">清空日志</button>
            </div>

            <pre class="log-output" id="log-output"></pre>
          </section>
        </section>
      </main>
    </div>

    <script src="./renderer.js"></script>
  </body>
</html>
